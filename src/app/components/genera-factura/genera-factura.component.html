<div class="min-h-screen bg-gray-50 py-4">
  <!-- Primera pantalla - Consulta de ticket -->
  <div *ngIf="isBusquedaTicket" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
    <!-- Header -->
    <div class="text-center mb-4">
      <h1 class="text-3xl font-bold text-gray-900">Generar Factura</h1>
      <p class="text-gray-600">Ingresa el número de ticket para consultar una venta</p>
    </div>

    <!-- Input and Button Section -->
    <div class="space-y-4">
      <!-- Ticket Number Input -->
      <div>
        <input type="text" id="ticketNumber" [(ngModel)]="ticketNumber"
          (blur)="ticketNumber = ticketNumber ? ticketNumber.trim() : ''" [disabled]="isLoading"
          placeholder="#Folio / Referencia"
          class="w-full px-4 py-3 border border-gray-300 border-solid rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200 disabled:bg-gray-100 disabled:cursor-not-allowed">
      </div>

      <!-- Consultation Button -->
      <button type="button" (click)="consultarVenta()" [disabled]="isLoading || !ticketNumber"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-[1.02] disabled:hover:scale-100 active:scale-[0.98] flex items-center justify-center shadow-md hover:shadow-lg">
        <!-- Spinner -->
        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
          fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>

        <!-- Button Text -->
        <span *ngIf="!isLoading">Consultar Venta</span>
        <span *ngIf="isLoading">Consultando...</span>
      </button>
    </div>

    <!-- Info Card -->
    <div class="mt-8 bg-blue-50 border border-blue-200 rounded-lg p-4">
      <div class="flex items-start">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
              clip-rule="evenodd"></path>
          </svg>
        </div>
        <div class="ml-3 flex-1">
          <p class="text-sm text-blue-700 mt-1">
            El número de ticket debe corresponder a una venta válida en el sistema.
          </p>
          <div class="flex justify-between items-end mt-3 gap-2">
            <div>
              <p class="text-sm text-blue-700">Ver {{ Global.VERSION }}</p>
              <p class="text-[10px] text-blue-500">F-{{ Global.ENV_NAME }} B-{{ backEndEnv }}</p>
            </div>
            <button *ngIf="isAuthenticated" (click)="navigateToDashboard()"
              class="inline-flex items-center px-2.5 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-md text-xs font-semibold shadow-md hover:shadow-lg transition-all duration-200 whitespace-nowrap"
              title="Panel de Administración">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mr-1.5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
              <span>Admin</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Segunda pantalla - Detalle de la venta y Formulario -->
  <div *ngIf="!isBusquedaTicket">
    <!-- Skeleton Loader mientras carga los datos de la venta en el padre -->
    <div *ngIf="isLoading" class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-4 animate-pulse">
      <div class="h-6 bg-gray-200 rounded w-3/4 mx-auto mb-4"></div>
      <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
      <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
      <div class="h-64 bg-gray-200 rounded mb-4"></div>
      <div class="h-32 bg-gray-200 rounded"></div>
    </div>

    <!-- Formulario Detalle (Componente Refactorizado) -->
    <app-factura-detalle *ngIf="!isLoading" [ventaTapete]="ventaTapete" [certificado]="certificado"
      [sucursal]="sucursal" (onReset)="regresarAConsulta()">
    </app-factura-detalle>
  </div>
</div>
